[package]
name = "qqbot-rust-sdk"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A SDK with Tencent Offical QQ Bot models and API defining based on https://bot.q.qq.com/wiki/."
repository = "https://github.com/Dorimu-Nya/qqbot-rust-sdk"

[lib]
name = "qqbot_rust_sdk"

[features]
default = ["events", "openapi", "signature"]
events = [
    "dep:paste",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_repr",
    "dep:strum",
]
openapi = [
    "dep:async-trait",
    "dep:http",
    "dep:percent-encoding",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_repr",
    "dep:thiserror",
    "dep:tokio",
]
signature = ["dep:ed25519-dalek", "dep:hex", "dep:thiserror"]

[dependencies]
async-trait = { version = "0.1", optional = true }
ed25519-dalek = { version = "2", optional = true }
hex = { version = "0.4", optional = true }
http = { version = "1", optional = true }
paste = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_repr = { version = "0.1.20", optional = true }
strum = { version = "0.28", features = ["derive"], optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "rt"], optional = true }

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
