[package]
name = "qqbot-rust-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust SDK for Tencent QQ Bot webhook events, OpenAPI, and signatures"
repository = "https://github.com/Dorimu-Nya/qqbot-rust-sdk"

[lib]
name = "qqbot_rust_sdk"

[features]
default = ["events", "openapi", "signature"]
events = ["dep:paste"]
openapi = []
signature = []

[dependencies]
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
http = "1"
once_cell = "1.21.4"
paste = { version = "1", optional = true }
percent-encoding = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1.20"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "rt"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
